<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioHub · Iniciar Sesión</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
    <h1>BioHub · Plataforma Nacional de Biodiversidad</h1>
    <div class="nav-acciones">
        <button type="button" class="header-btn" onclick="entrarComoVisitante()">Consulta Pública (Visitante)</button>
    </div>
</header>

<div class="contenedor-centrado">
    <section class="card">
        <h2>Iniciar Sesión (HU-01)</h2>
        <label for="username">Usuario</label>
        <input id="username" type="text" placeholder="Ingresa tu usuario">

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingresa tu contraseña">

        <button type="button" class="btn-bloque" onclick="procesarLogin()">Iniciar Sesión</button>
        <button type="button" class="outline btn-bloque" onclick="entrarComoVisitante()">Continuar sin cuenta (Visitante Público)</button>

        <div id="mensajeLogin"></div>

        <table class="tabla-credenciales">
            <thead>
                <tr>
                    <th>Rol</th>
                    <th>Usuario</th>
                    <th>Contraseña</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Director Científico</td>
                    <td><code>director</code></td>
                    <td><code>Director2026*</code></td>
                </tr>
                <tr>
                    <td>Investigador de Campo</td>
                    <td><code>investigador</code></td>
                    <td><code>Campo2026*</code></td>
                </tr>
                <tr>
                    <td>Auditor Científico</td>
                    <td><code>auditor</code></td>
                    <td><code>Auditor2026*</code></td>
                </tr>
                <tr>
                    <td>Consumidor Externo</td>
                    <td><code>externo</code></td>
                    <td><code>Externo2026*</code></td>
                </tr>
            </tbody>
        </table>

        <div class="enlace-pie">
            ¿Nuevo usuario? <a href="/registro.html">Crear cuenta aquí</a>
        </div>
    </section>
</div>

<script src="/auth.js"></script>
<script>
    async function procesarLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const box = document.getElementById('mensajeLogin');

        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await resp.json();

        if (!resp.ok) {
            box.className = 'alerta error';
            box.textContent = data.error;
            return;
        }

        guardarToken(data.token);
        redirigirSegunRol(data.rol);
    }

    function entrarComoVisitante() {
        guardarToken(null);
        window.location.href = '/publico.html';
    }
</script>
</body>
</html>
